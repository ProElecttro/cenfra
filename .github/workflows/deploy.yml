name: Cenfra Deploy

on:
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    runs-on: [self-hosted, cenfra-runner]

    steps:
      - name: Show deployment request
        run: |
          echo "Repository: ${{ github.event.client_payload.repository }}"
          echo "Branch:     ${{ github.event.client_payload.branch }}"
          echo "Commit:     ${{ github.event.client_payload.sha }}"
          echo "Host port:  ${{ github.event.client_payload.host_port }}"
          echo "App port:   ${{ github.event.client_payload.app_port }}"

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repository }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ secrets.HOSTING_GH_TOKEN }}

      - name: Verify Dockerfile
        run: |
          test -f Dockerfile
          echo "Dockerfile found"

      - name: Build Docker image
        run: |
          docker build \
            -t cenfra-${{ github.event.client_payload.repository }}:${{ github.event.client_payload.sha }} \
            .

      - name: Run application
        run: |
          docker run -d \
            --name cenfra-${{ github.event.client_payload.repository }} \
            -p ${{ github.event.client_payload.host_port }}:${{ github.event.client_payload.app_port }} \
            cenfra-${{ github.event.client_payload.repository }}:${{ github.event.client_payload.sha }}
